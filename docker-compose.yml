services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=bitkoop_miner
      - POSTGRES_USER=miner
      - POSTGRES_PASSWORD=miner_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miner -d bitkoop_miner"]
      interval: 5s
      timeout: 5s
      retries: 5

  notary-server:
    image: ghcr.io/tlsnotary/tlsn/notary-server:v0.1.0-alpha.7

  miner:
    image: ghcr.io/bitkooplabs/bitkoop-miner:latest
    ports:
      - "8080:8080"
    volumes:
      - ./artifacts:/app/artifacts
      - ~/.bittensor:/root/.bittensor
    environment:
      - NETUID=${NETUID:-1}
      - SUBTENSOR_NETWORK=${SUBTENSOR_NETWORK:-finney}
      - SUBTENSOR_ADDRESS=${SUBTENSOR_ADDRESS:-wss://entrypoint-finney.opentensor.ai:443}
      - WALLET_NAME=${WALLET_NAME:-default}
      - HOTKEY_NAME=${HOTKEY_NAME:-default}
      - CHECK_STALENESS_HOURS=${CHECK_STALENESS_HOURS:-24}
      - DATABASE_URL=postgresql://miner:miner_pass@postgres:5432/bitkoop_miner
      - TLSNOTARY_URL=${TLSNOTARY_URL:-http://notary-server:7047}
      - TLSNOTARY_MODE=${TLSNOTARY_MODE:-local}
    depends_on:
      postgres:
        condition: service_healthy
      notary-server:
        condition: service_started
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command: uvicorn bitkoop_miner_server.app:app --host 0.0.0.0 --port 8080 --reload
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 30


volumes:
  postgres_data:
